services:
  - type: web
    name: horse-breeding-tracker
    env: python
    plan: free
    buildCommand: "python -m pip install --upgrade pip"
    startCommand: "sh ./start.sh"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: SESSION_SECRET
        value: change-me-in-render
